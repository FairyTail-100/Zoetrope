<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoetrope - No-Build Script Tag Example</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0b0c10;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      .scroll-container {
        height: 300vh;
        position: relative;
      }
      .viewport-pin {
        position: sticky;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .hud {
        position: fixed;
        bottom: 24px;
        left: 24px;
        background: rgba(11, 12, 16, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 14px;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div class="scroll-container">
      <div class="viewport-pin">
        <canvas id="viewport"></canvas>
      </div>
    </div>

    <div class="hud">
      <div><strong>Zoetrope</strong> (No-Build ESM)</div>
      <div id="hud-status">Status: Initializing...</div>
    </div>

    <!--
      NOTE: This file must be served over HTTP (e.g. `pnpm dlx serve dist-release`),
      NOT opened directly as file://, because ES modules and fetch require an HTTP origin.
      The dist-release/ directory and bundles are produced by `pnpm release:build`.
      Frame assets do not ship inside dist-release/ to keep release bundles lightweight;
      supply your compiled manifest URL via the ?manifest=<url> query parameter.
    -->
    <script type="module">
      import { Zoetrope } from './zoetrope.min.js';

      const canvas = document.querySelector('#viewport');
      const hudStatus = document.querySelector('#hud-status');

      // Check for manifest query param override or use default showcase asset
      const params = new URLSearchParams(window.location.search);
      const manifestUrl = params.get('manifest')
        ? decodeURIComponent(params.get('manifest'))
        : '/assets/showcase/manifest.json';

      const engine = new Zoetrope({
        manifest: manifestUrl,
        canvas,
        renderer: {
          fit: 'cover'
        },
        cache: {
          maxMemoryBytes: 128 * 1024 * 1024
        }
      });

      engine.on('load', (manifest) => {
        hudStatus.textContent = `Status: Ready (${manifest.metadata.totalFrames} frames @ ${manifest.metadata.fps} fps)`;
      });

      await engine.init();

      window.addEventListener('beforeunload', () => {
        engine.destroy();
      });
    </script>
  </body>
</html>
