name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg and encoders
        run: |
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders | grep -E "libwebp|libaom-av1|mjpeg"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Skills validation tests
        run: pnpm test:skills

      - name: Pack packages and test standalone package installs
        run: pnpm pack:all && pnpm test:packages

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg and encoders
        run: |
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders | grep -E "libwebp|libaom-av1|mjpeg"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Build and pack packages
        run: pnpm build && pnpm pack:all

      - name: Run scaffold verification
        run: pnpm test:scaffold

      - name: Run Playwright E2E suite
        run: pnpm test:e2e
